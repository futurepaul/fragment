[package]
name = "hermes-boot"
version = "0.1.0"
description = "The Hermes image's boot: restore gate, preload, config, profiles from the computer's agents, their repos, the bridge, the hold's copies of its databases"
edition.workspace = true
license.workspace = true

[[bin]]
name = "hermes-boot"
path = "src/main.rs"

[dependencies]
base64.workspace = true
bytes.workspace = true
fragment-bridge = { path = "../../bridge" }
futures-util.workspace = true
libc = "0.2"
# SQLite's online backup and quick_check (held.rs): Hermes' databases are
# copied whole under the hold. SQLite built in (bundled): the image's
# musl build has no system library to link.
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "backup"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
http-body-util.workspace = true
hyper.workspace = true
