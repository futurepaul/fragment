<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Computer screen</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1c1a; --muted: #6b6862; --bar: #ebe9e4; --accent: #2f5bd3; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #ecebe7; --muted: #9a968e; --bar: #22211e; --accent: #7c9cff; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: var(--bar); }
  #status { color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent); background: transparent; color: var(--accent); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  button:disabled { opacity: .5; cursor: default; }
  #screen { flex: 1; min-height: 0; }
</style>
</head>
<body>
<header>
  <span id="status">Connecting to the screen…</span>
  <button id="control" type="button" aria-pressed="false" disabled>Take over</button>
</header>
<div id="screen"></div>
<script type="module">
  // The computer's screen (decision 11): everyone here sees it; only the
  // viewer holding control sends input, and the server enforces that.
  import RFB from "./novnc/core/rfb.js";

  const viewer = crypto.randomUUID().replaceAll("-", "");
  const base = new URL(".", location.href);
  const socket = (path) => {
    const u = new URL(path, base);
    u.protocol = u.protocol === "https:" ? "wss:" : "ws:";
    u.searchParams.set("viewer", viewer);
    return u.href;
  };
  const status = document.getElementById("status");
  const button = document.getElementById("control");
  let mine = false;

  const rfb = new RFB(document.getElementById("screen"), socket("websockify"), { shared: true });
  rfb.viewOnly = true;
  rfb.scaleViewport = true;
  rfb.addEventListener("connect", () => { status.textContent = "Watching the agent's screen"; button.disabled = false; });
  rfb.addEventListener("disconnect", () => { status.textContent = "The screen closed. Reload to see it again."; button.disabled = true; });

  const control = new WebSocket(socket("control"));
  control.addEventListener("message", (e) => {
    const m = JSON.parse(e.data);
    if (m.type !== "control") return;
    mine = m.holder === viewer;
    rfb.viewOnly = !mine;
    button.textContent = mine ? "Give back" : "Take over";
    button.setAttribute("aria-pressed", String(mine));
    status.textContent = mine ? "You have the screen" : m.holder ? "Someone else has the screen" : "Watching the agent's screen";
  });
  button.addEventListener("click", () => control.send(JSON.stringify({ type: mine ? "give" : "take" })));
</script>
</body>
</html>
