<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stub computer</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f5f2; --fg: #1d1c1a; --muted: #6b6862; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --fg: #ecebe7; --muted: #9a968e; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 15px/1.5 system-ui, sans-serif; }
  main { padding: 24px; max-width: 32rem; text-align: center; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>This computer has no screen</h1>
  <p>It runs the stub image: the bridge with its scripted agent, so the
  platform's lanes run without any agent runtime. Its screen port serves
  only this page.</p>
</main>
</body>
</html>
