[workspace]
resolver = "2"
members = ["cli", "crates/proto", "crates/nip98", "crates/core", "crates/native", "crates/fakes", "crates/devstack", "crates/e2e", "crates/node", "crates/computer", "crates/templates", "xtask"]
# cell/ builds for wasm32 with worker-build; sandcastle/ is a workspace of
# its own that must not depend on fragment's crates (docs/sandbox.md,
# decision 4).
exclude = ["cell", "agent", "sandcastle"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
strip = true
