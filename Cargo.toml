[workspace]
resolver = "2"
members = ["cli", "crates/proto", "crates/nip98", "crates/core", "crates/fakes", "crates/devstack", "crates/e2e", "crates/lan", "crates/templates", "xtask"]
# cell/ and agent/ build for wasm32 with worker-build.
exclude = ["cell", "agent"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
strip = true

# RSA keys are made by the OIDC fake (dev, the e2e) and oidc.rs's tests:
# its bignums unoptimized make one in seconds instead of milliseconds.
[profile.dev.package.num-bigint-dig]
opt-level = 3
