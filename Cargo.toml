[workspace]
resolver = "2"
members = ["cli", "crates/proto", "crates/nip98", "crates/core", "crates/fakes", "crates/devstack", "crates/e2e", "crates/templates", "xtask"]
# cell/ and agent/ build for wasm32 with worker-build.
exclude = ["cell", "agent"]

[workspace.package]
edition = "2021"
license = "MIT"

[profile.release]
strip = true
