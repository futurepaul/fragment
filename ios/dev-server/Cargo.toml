[package]
name = "fragment-ios-fixture"
version = "0.1.0"
edition = "2021"
publish = false

# A simulator fixture, independently built. The iOS app has no Rust dependency.
[workspace]

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net"] }

[profile.dev]
debug = 0
