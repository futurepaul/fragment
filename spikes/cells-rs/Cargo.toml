[package]
name = "spike-cells-rs"
version = "0.1.0"
edition = "2021"

# A spike: outside any workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# 0.8.5, not 0.8.6: 0.8.6 is younger than the two-week dependency cooldown.
worker = "=0.8.5"
worker-sys = "=0.8.5"
worker-macros = "=0.8.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
