[package]
name = "spike-driver"
version = "0.1.0"
edition = "2021"

# A spike: outside any workspace. Cargo.lock is seeded from cli/ so the
# shared crates resolve to versions already vetted there.
[workspace]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "=0.29.0"
anyhow = "1"
