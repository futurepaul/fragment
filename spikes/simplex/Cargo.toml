# The SimpleX connector spike (docs/explorations/simplex-connector.md): not
# product code, never built by the root workspace or CI. Its own workspace
# and lock, as images/ has.
[workspace]

[package]
name = "simplex-spike"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
anyhow = "=1.0.104"
serde_json = "=1.0.151"
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
