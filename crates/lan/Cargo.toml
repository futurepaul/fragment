[package]
name = "fragment-lan"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The dev stack on a home network, run as an intranet runs it (docs/self-host-lan.md): a private CA and its certificates, DNS for a delegated subzone that forwards every other name, a TLS front door before the cell and Dex, and Dex pinned."

[[bin]]
name = "fragment-lan"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the front door and DNS: one tokio runtime, HTTP/1.1 with upgrades both ways
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "signal"] }
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio", "server"] }
http-body-util = "0.1"
bytes = "1"
# TLS: rustls on ring, as reqwest's already is here
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# DNS messages (the server is ours: the zone's answers, every other name forwarded as it came)
hickory-proto = { version = "=0.26.3", default-features = false, features = ["std"] }
# the CA and the zone's certificate
rcgen = { version = "=0.14.10", features = ["pem", "ring", "x509-parser"] }
time = "0.3"
# Dex's static passwords are bcrypt hashes
bcrypt = "=0.19.3"
# Dex, fetched by digest from its release image (dex.rs)
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = { version = "0.4", default-features = false }
base64 = "0.22"

[dev-dependencies]
x509-parser = "=0.18.1"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
