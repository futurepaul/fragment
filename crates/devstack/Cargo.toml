[package]
name = "fragment-devstack"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Starts and stops the local fragment stack (`wrangler dev` for cell/ and agent/) for xtask and the e2e, on a pinned Node it fetches; and, off Cloudflare, the browser preview cards are shot with."

[dependencies]
anyhow = "1"
fragment-core = { path = "../core" }
# an e2e run's summary (src/summary.rs), written by the suite, read by xtask
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the pinned Node (src/node.rs): fetched over HTTPS, checked by its
# SHA-256, unpacked from its .tar.gz
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
flate2 = "1"
tar = { version = "0.4", default-features = false }
# the pinned chrome-headless-shell (src/browser.rs) comes as a zip: read
# with flate2's deflate alone, no other method or encryption
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }
# the renderer's CDP socket (src/rendering/ws.rs): its handshake's accept key
sha1 = "0.10"
base64 = "0.22"

[dev-dependencies]
# codestore.rs's tests make a fixed org key
p256 = { version = "0.13", features = ["pkcs8", "pem"] }
# rendering.rs's tests are the cell's side of the CDP socket
tungstenite = "=0.29.0"
