[package]
name = "fragment-fakes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Local stand-ins for the services the platform calls: code.storage (and, from slice F, OpenRouter and a web push service)."

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
# The fakes' own halves of the platform's crypto: code.storage signs its
# webhooks (HMAC), and the push service decrypts as a browser (HKDF, AES-GCM).
hmac = "0.12"
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pem", "pkcs8"] }
fragment-core = { path = "../core" }
fragment-nip98 = { path = "../nip98", features = ["sign"] }
# The sandcastle fake's computers are reached by their keys, through a relay
# of its own (docs/runtime-seam.md): iroh and its relay server, as the node's.
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.3.0", features = ["server"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
