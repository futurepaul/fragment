[package]
name = "fragment-templates"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The files the release serves from the cell's Static Assets (templates/, the shell, the agent docs): their index for the cell, and with `embed` their bytes for the CLI and xtask."
build = "build.rs"

[features]
default = ["platform"]
# The platform's own files: its blessed templates (src/blessed_names.rs:
# agent, chat, brain, skills), which the cell makes fragments of and serves
# (blessed.rs), and the shell's (cell/shell/). The CLI builds without: it
# scaffolds the other templates alone (`fragment new --list`) and serves no
# shell, so a change to the chat page, a blessed template or the shell is
# no change to it, nor to the computer image that carries it
# (docs/computers.md, "Stable and canary").
platform = []
# Each file's bytes beside its index entry: the CLI scaffolds them, xtask
# writes them into the assets directory a cell build uploads, and the e2e
# compares what the cell serves with them. The cell builds without, and
# reads them from its Static Assets (cell/src/assets.rs).
embed = ["dep:sha2", "dep:hex"]

[dependencies]
fragment-core = { path = "../core" }
fragment-proto = { path = "../proto" }
# to check each file against its hash as xtask writes it (`write_assets`)
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }

[build-dependencies]
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
sha2 = "0.10"
hex = "0.4"
