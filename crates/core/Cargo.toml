[package]
name = "fragment-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The cell's pure logic: access, fragment.json, secrets at rest, code.storage tokens, webhooks, serving helpers. Runs in the cell (wasm32) and is tested on the host."

[dependencies]
fragment-proto = { path = "../proto" }
serde = { version = "1", features = ["derive"] }
# raw_value: an app's result crosses into the response as the text it answered.
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
bech32 = "0.9"
url = "2.5"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# No `std`: it enables rand_core's getrandom, which does not build for the
# cell. ECDSA signing is deterministic (RFC 6979) and needs no randomness.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "pem", "pkcs8"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
