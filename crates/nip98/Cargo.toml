[package]
name = "fragment-nip98"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NIP-98 HTTP auth (kind 27235): verify in the cell (wasm), sign on hosts."

[features]
# Signing needs randomness for key generation; the cell only verifies.
sign = ["dep:rand_core"]

[dependencies]
k256 = { version = "=0.13.4", default-features = false, features = ["schnorr"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
serde_json = "1"
url = "2.5"
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[dev-dependencies]
# the CLI's signer, to prove the two implementations agree
secp256k1 = { version = "0.29", features = ["global-context"] }
