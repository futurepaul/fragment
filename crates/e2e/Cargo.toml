[package]
name = "fragment-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The end-to-end suite: a real celld node, the real cell, signed HTTP."

[dependencies]
anyhow = "1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
fragment-proto = { path = "../proto" }
fragment-nip98 = { path = "../nip98", features = ["sign"] }
fragment-devstack = { path = "../devstack" }
