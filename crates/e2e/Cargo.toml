[package]
name = "fragment-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The end-to-end suite: the real cell under wrangler dev with the vendor fakes, or a branch deployment on real vendors (--hosted); the CLI; signed HTTP."

[dependencies]
anyhow = "1"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# rustls: a hosted run's sockets are wss to a preview's hosts
tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots"] }
fragment-proto = { path = "../proto" }
fragment-core = { path = "../core" }
fragment-nip98 = { path = "../nip98", features = ["sign"] }
fragment-devstack = { path = "../devstack" }
fragment-fakes = { path = "../fakes" }
