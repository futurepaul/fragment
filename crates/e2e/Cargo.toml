[package]
name = "fragment-e2e"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "The end-to-end suite: a real celld node, the real cell, the code.storage fake, the CLI, signed HTTP."

[dependencies]
anyhow = "1"
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = "=0.29.0"
# A page's iroh peer against the sandcastle fake (docs/runtime-seam.md).
iroh = { version = "=1.3.0", default-features = false, features = ["tls-ring"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "io-util", "time"] }
fragment-proto = { path = "../proto" }
fragment-core = { path = "../core" }
fragment-nip98 = { path = "../nip98", features = ["sign"] }
fragment-devstack = { path = "../devstack" }
fragment-fakes = { path = "../fakes" }
