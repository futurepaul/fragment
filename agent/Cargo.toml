[package]
name = "fragment-agent"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agents on celld: goose's loop in a Durable Object, acting on fragments through their operations."

# Built for wasm32 by worker-build (`cargo xtask build`), outside the host workspace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# 0.8.5, not 0.8.6: 0.8.6 is younger than the two-week dependency cooldown.
worker = "=0.8.5"
worker-macros = "=0.8.5"
worker-sys = "=0.8.5"
goose-agent = "=0.1.0-alpha.9"
goose-provider-types = { version = "=0.1.0-alpha.9", default-features = false }
rmcp = { version = "3.2.0", default-features = false }
tokio = { version = "1.48", default-features = false, features = ["sync", "macros", "rt"] }
tokio-util = { version = "0.7.12", default-features = false }
futures = "0.3"
async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
fragment-proto = { path = "../crates/proto" }
fragment-nip98 = { path = "../crates/nip98", features = ["signer"] }
fragment-core = { path = "../crates/core" }

# goose's GDK from the fork: wasm32 fixes and goose-developer on
# gdk-v0.1.0-alpha.9 (https://github.com/futurepaul/goose/commit/12922e7)
[patch.crates-io]
goose-agent = { git = "https://github.com/futurepaul/goose", rev = "12922e73ce9f8a36ec157813305ee33be0896873" }
goose-provider-types = { git = "https://github.com/futurepaul/goose", rev = "12922e73ce9f8a36ec157813305ee33be0896873" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
