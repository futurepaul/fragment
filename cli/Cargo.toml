[package]
name = "fragment-cli"
version = "0.3.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "fragment"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
bech32 = "0.9"
base64 = "0.22"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
dirs = "5"
anyhow = "1"

[profile.release]
strip = true
