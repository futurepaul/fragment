[package]
name = "fragment-cli"
version = "0.6.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "fragment"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
bech32 = "0.9"
base64 = "0.22"
rand = "0.8"
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
dirs = "5"
anyhow = "1"
walkdir = "=2.5.0"
ignore = "=0.4.25"
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
fs2 = "=0.4.3"
diffy = "=0.5.0"
tungstenite = "=0.29.0"
oxc_allocator = "0.147.0"
oxc_parser = "0.147.0"
oxc_span = "0.147.0"
oxc_ast = "0.147.0"
oxc_transformer = "0.147.0"
oxc_codegen = "0.147.0"
oxc_semantic = "0.147.0"

[profile.release]
strip = true
