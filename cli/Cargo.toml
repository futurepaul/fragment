[package]
name = "fragment-cli"
version = "0.13.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "fragment"
path = "src/main.rs"

[dependencies]
fragment-templates = { path = "../crates/templates", features = ["embed"] }
fragment-core = { path = "../crates/core" }
fragment-proto = { path = "../crates/proto" }
fragment-nip98 = { path = "../crates/nip98", features = ["sign"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS trusts the public roots and the machine's own: a company's CA (its
# intranet's, or its TLS-inspecting proxy's), installed in the OS's store
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
dirs = "5"
anyhow = "1"
ignore = "=0.4.25"
notify = "=8.2.0"
notify-debouncer-full = "=0.7.0"
fs2 = "=0.4.3"
tungstenite = { version = "=0.29.0", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }


[dev-dependencies]
fragment-fakes = { path = "../crates/fakes" }
