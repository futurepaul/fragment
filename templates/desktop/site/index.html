<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="desktop.css">
</head>
<body>
  <!-- sidebar | gutter | chat | gutter | viewer, one grid (see layout.js) -->
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand" id="brand">Desktop</div>
        <button class="icon-button" id="collapse-left" type="button" title="Hide sidebar (⌘B)" aria-label="Hide sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
      </div>
      <button class="new-chat" id="new-chat" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>New chat
      </button>
      <div class="section-label">Chats</div>
      <nav class="rows" id="chats"></nav>
      <div class="section-label">Apps<button class="icon-button small" id="add-app" type="button" title="Add an app" aria-label="Add an app"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <nav class="rows" id="apps"></nav>
      <div class="spacer"></div>
    </aside>
    <div class="gutter gutter-col" id="gutter-left" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" title="Drag to resize · double-click to reset"></div>

    <main class="chat">
      <header class="topbar">
        <button class="icon-button when-left-closed" id="toggle-left" type="button" title="Show sidebar (⌘B)" aria-label="Show sidebar"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/></svg></button>
        <button class="icon-button when-left-closed" id="new-chat-top" type="button" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>
        <span class="crumb">Chats</span>
        <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
        <strong class="title" id="chat-title">No chat open</strong>
        <span class="grow"></span>
        <button class="icon-button toggle-right" id="toggle-right" type="button" title="Toggle viewer (⌥⌘B)" aria-label="Toggle viewer"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg><span class="badge" id="viewer-count" hidden></span></button>
      </header>
      <div class="frames" id="frames">
        <div class="notice" id="notice"><strong>Loading your desktop…</strong></div>
      </div>
    </main>

    <div class="gutter gutter-col" id="gutter-right" role="separator" aria-orientation="vertical" aria-label="Resize viewer" title="Drag to resize · double-click to reset"></div>
    <section class="viewer is-empty" id="viewer" aria-label="Viewer">
      <div class="stack" id="stack"></div>
      <div class="viewer-empty" id="viewer-empty">
        <div class="viewer-empty-head">
          <strong>Nothing open</strong>
          <button class="icon-button" id="collapse-right" type="button" title="Hide viewer (⌥⌘B)" aria-label="Hide viewer"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></svg></button>
        </div>
        <p>Apps and files you open stack up here. Drag the separators between them to resize.</p>
        <div class="quick" id="quick-open"></div>
      </div>
    </section>
  </div>
  <div class="scrim" id="scrim"></div>
  <script type="module" src="desktop.js"></script>
</body>
</html>
