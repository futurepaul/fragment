<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hermes</title>
  <style>
    :root { --bg: #f7f5f0; --fg: #1d1b16; --muted: #857f72; --line: #e2ddd2; --accent: #2f5d50; --you: #e9e4d8; --bad: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16150f; --fg: #eeeae0; --muted: #9a9384; --line: #2d2b24; --accent: #7fb5a3; --you: #25231c; --bad: #f2b8b5; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; display: grid; grid-template-columns: 16rem 1fr; }
    aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    aside header { padding: 1rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
    h1 { font: 600 1.25rem/1.2 Georgia, serif; margin: 0; }
    #chats { list-style: none; margin: 0; padding: 0 .5rem 1rem; overflow-y: auto; }
    #chats li { padding: .45rem .6rem; border-radius: .4rem; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #chats li:hover { background: var(--you); }
    #chats li.open { background: var(--you); font-weight: 600; }
    main { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    #status { padding: .6rem 1rem; color: var(--muted); font-size: .9rem; }
    #status:empty { display: none; }
    #transcript { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .row { max-width: 46rem; white-space: pre-wrap; overflow-wrap: anywhere; }
    .row.user { align-self: flex-end; background: var(--you); padding: .5rem .8rem; border-radius: .8rem; }
    .row.assistant.streaming:empty::after { content: "…"; color: var(--muted); }
    .row.tool { color: var(--muted); font: .85rem/1.4 ui-monospace, monospace; }
    .row.tool::before { content: "↳ "; }
    .row.tool.running::after { content: " …"; }
    .row.note, .row.failed { color: var(--bad); }
    form { display: flex; gap: .5rem; padding: .75rem 1rem 1rem; border-top: 1px solid var(--line); }
    textarea { flex: 1; resize: none; height: 3rem; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: .5rem; background: transparent; color: inherit; font: inherit; }
    button { padding: .5rem .9rem; border: 0; border-radius: .5rem; background: var(--accent); color: var(--bg); font: inherit; cursor: pointer; }
    button.quiet { background: none; color: var(--accent); border: 1px solid var(--line); }
    #stop { display: none; }
    body[data-turn] #stop { display: inline-block; }
    body[data-turn] #send { display: none; }
    body:not([data-state="ready"]) form, body:not([data-state="ready"]) #transcript { opacity: .5; }
    @media (max-width: 40rem) {
      body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { border-right: 0; border-bottom: 1px solid var(--line); }
      #chats { display: flex; gap: .25rem; overflow-x: auto; padding-bottom: .5rem; }
      #chats li { flex: none; max-width: 12rem; }
    }
  </style>
</head>
<body data-state="connecting">
  <aside>
    <header><h1>Hermes</h1><button id="new" class="quiet" type="button">New chat</button></header>
    <ul id="chats"></ul>
  </aside>
  <main>
    <div id="status">Connecting…</div>
    <div id="transcript"></div>
    <form id="composer">
      <textarea id="text" placeholder="Message Hermes" maxlength="20000" autocomplete="off"></textarea>
      <button id="send">Send</button>
      <button id="stop" class="quiet" type="button">Stop</button>
    </form>
  </main>
  <script type="module" src="./chat.js"></script>
</body>
</html>
