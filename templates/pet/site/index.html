<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pet</title>
  <style>
    :root { --bg: #f7f5f0; --fg: #1d1b16; --muted: #857f72; --line: #e2ddd2; --well: #ebe7de; --accent: #3d5a80; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16150f; --fg: #eeeae0; --muted: #9a9384; --line: #2d2b24; --well: #211f18; --accent: #9dbbe0; } }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 64rem; margin: 2rem auto; padding: 0 1rem; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: .25rem 1rem; margin-bottom: .75rem; }
    h1 { font: 600 1.6rem/1.2 Georgia, serif; margin: 0; }
    #note, .status { color: var(--muted); font-size: .85rem; }
    a { color: var(--accent); }
    form { display: flex; gap: .5rem; flex: 1; }
    input { flex: 1; min-width: 0; padding: .6rem .75rem; border: 1px solid var(--line); border-radius: .5rem; background: transparent; color: inherit; font: inherit; }
    button { padding: .6rem 1rem; border: 0; border-radius: .5rem; background: var(--accent); color: var(--bg); font: inherit; cursor: pointer; white-space: nowrap; }
    button:disabled, input:disabled { opacity: .45; cursor: default; }
    .screen { position: relative; margin: .75rem 0 .4rem; aspect-ratio: 16 / 10; border: 1px solid var(--line); border-radius: .75rem; overflow: hidden; background: var(--well); box-shadow: 0 10px 30px rgb(0 0 0 / .08); }
    .screen img { display: block; width: 100%; height: 100%; cursor: crosshair; user-select: none; -webkit-user-drag: none; }
    .screen.watching img { cursor: default; }
    #empty { position: absolute; inset: 0; display: grid; place-content: center; gap: .5rem; padding: 1rem; text-align: center; color: var(--muted); }
    #empty b { font: 600 1.2rem/1.3 Georgia, serif; color: var(--fg); animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: .4; } }
    .poke { position: absolute; width: 1.6rem; height: 1.6rem; margin: -.8rem 0 0 -.8rem; border: 2px solid var(--accent); border-radius: 50%; pointer-events: none; animation: poke .6s ease-out forwards; }
    @keyframes poke { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.7); opacity: 0; } }
    .status { display: flex; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    #title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #driver { white-space: nowrap; }
    .drive { display: flex; flex-wrap: wrap; gap: .5rem; }
    .keys { display: flex; gap: .5rem; }
    .keys button { background: transparent; color: var(--fg); border: 1px solid var(--line); }
    #ask { margin-top: .75rem; }
    #work { list-style: none; margin: .75rem 0 0; padding: .6rem .8rem; border: 1px solid var(--line); border-radius: .5rem; font-size: .85rem; color: var(--muted); }
    #work li + li { margin-top: .2rem; }
    #work .task, #work .end { color: var(--fg); }
    #work .end { margin-top: .4rem; }
    #work .failed { color: #b3261e; }
    #work code { font: .8rem ui-monospace, SFMono-Regular, monospace; color: var(--fg); overflow-wrap: anywhere; }
    #error { color: #b3261e; min-height: 1.5rem; margin-top: .5rem; font-size: .9rem; }
    @media (max-width: 40rem) { main { margin-top: 1.25rem; } .keys { width: 100%; } .keys button { flex: 1; } }
  </style>
</head>
<body>
  <main>
    <header><h1>Pet</h1><div id="note">connecting…</div></header>
    <form id="go"><input id="url" inputmode="url" placeholder="Open a web address" autocomplete="off" disabled><button disabled>Open</button></form>
    <div class="screen watching" id="screen">
      <img id="frame" alt="The pet's screen" hidden>
      <div id="empty"><b>Waking the pet…</b><span>Its first start installs a browser, which takes a minute or two.</span></div>
    </div>
    <div class="status"><span id="title"></span><span id="driver"></span></div>
    <div class="drive">
      <form id="type"><input id="text" placeholder="Type into it" maxlength="500" autocomplete="off" disabled><button disabled>Type</button></form>
      <div class="keys"><button data-key="Enter" disabled>Enter</button><button data-key="Backspace" title="Backspace" aria-label="Backspace" disabled>⌫</button><button data-key="Escape" disabled>Esc</button></div>
    </div>
    <form id="ask" hidden><input id="task" placeholder="Ask it to do something" maxlength="2000" autocomplete="off"><button>Do it</button></form>
    <ol id="work" hidden></ol>
    <div id="error"></div>
  </main>
  <script type="module">
    import * as fragment from "./__fragment.js";

    const $ = (id) => document.getElementById(id);
    const show = (e) => { $("error").textContent = e ? e.message : ""; };
    const me = await fragment.me();
    let shown = null;

    // a record on `control`, which the pet's computer follows and applies
    // once; whether it was posted
    const send = (body) => fragment.post("control", body).then(() => (show(), true), (e) => (show(e), false));

    // who drove it last: you, or a username
    const names = new Map();
    const who = (id) => {
      if (id === me.principal) return "you";
      if (!names.has(id)) {
        const username = (p) => (p.profiles?.[id]?.username ? `@${p.profiles[id].username}` : "someone");
        names.set(id, fetch(`./__people?id=${encodeURIComponent(id)}`).then((r) => r.json()).then(username, () => "someone"));
      }
      return names.get(id);
    };

    fragment.live("screen", {}, async (s) => {
      if (!s) return;
      if (s.jpeg !== shown?.jpeg) $("frame").src = `data:image/jpeg;base64,${s.jpeg}`;
      shown = s;
      $("frame").hidden = false;
      $("empty").hidden = true;
      $("screen").style.aspectRatio = `${s.width} / ${s.height}`;
      $("title").textContent = s.title ? `on screen: ${s.title}` : "";
      // its agent drives as `agent:<who asked it>`
      const driven = (d) => (d.startsWith("agent:") ? who(d.slice(6)).then((asker) => `its agent, for ${asker}`) : who(d));
      $("driver").textContent = s.driver ? `last driven by ${await driven(s.driver)}` : "";
    }, show);

    $("frame").onclick = (e) => {
      if (!shown || $("screen").classList.contains("watching")) return;
      const r = e.currentTarget.getBoundingClientRect();
      const at = (offset, size, max) => Math.min(max - 1, Math.max(0, Math.round((offset / size) * max)));
      const poke = Object.assign(document.createElement("span"), { className: "poke" });
      poke.style.left = `${e.clientX - r.left}px`;
      poke.style.top = `${e.clientY - r.top}px`;
      poke.onanimationend = () => poke.remove();
      $("screen").append(poke);
      send({ kind: "click", x: at(e.clientX - r.left, r.width, shown.width), y: at(e.clientY - r.top, r.height, shown.height) });
    };

    $("go").onsubmit = (e) => {
      e.preventDefault();
      let url = $("url").value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) url = `https://${url}`;
      send({ kind: "open", url }).then((sent) => sent && ($("url").value = ""));
    };
    $("type").onsubmit = (e) => {
      e.preventDefault();
      const text = $("text").value;
      if (!text) return;
      send({ kind: "type", text }).then((sent) => sent && ($("text").value = ""));
    };
    for (const b of document.querySelectorAll("[data-key]")) b.onclick = () => send({ kind: "key", key: b.dataset.key });

    // its agent's latest run, from `work`: the task, each step as the
    // computer posts it (`turn.step`, as a chat's), and how it ended
    const runs = new Map();
    const li = (className, ...kids) => {
      const n = Object.assign(document.createElement("li"), { className });
      n.append(...kids);
      return n;
    };
    const code = (text) => Object.assign(document.createElement("code"), { textContent: text });
    async function showWork() {
      const r = runs.get(Math.max(...runs.keys()));
      const asker = r.asker ? `, asked by ${await who(r.asker)}` : "";
      const steps = [...r.steps.values()].sort((a, b) => a.step - b.step).map((s) => li("", ...(s.text ? [`${s.text} `] : []), code(`${s.tool} ${s.args}`)));
      const end = !r.end ? li("", "working…") : r.end.error || r.end.code ? li("end failed", r.end.error || r.end.message || `stopped (${r.end.code})`) : li("end", r.end.message);
      $("work").replaceChildren(li("task", `${r.task ?? "…"}${asker}`), ...steps, end);
      $("work").hidden = false;
    }
    fragment.subscribe("work", ({ body: b }) => {
      if (!Number.isInteger(b?.run)) return;
      if (!runs.has(b.run)) runs.set(b.run, { steps: new Map() });
      const r = runs.get(b.run);
      if (b.kind === "start") Object.assign(r, { task: b.task, asker: b.asker });
      if (b.kind === "turn.step" && Number.isInteger(b.step)) r.steps.set(b.step, b);
      if (b.kind === "end") r.end = b;
      showWork();
    }, { last: 200 });

    // editors ask it (the agent spends its owner's budget)
    if (["editor", "owner"].includes(me.role)) {
      $("ask").hidden = false;
      $("ask").onsubmit = (e) => {
        e.preventDefault();
        const task = $("task").value.trim();
        const button = $("ask").querySelector("button");
        if (!task) return;
        button.disabled = true;
        fragment.call("do", { task }).then(() => (($("task").value = ""), show()), show).finally(() => (button.disabled = false));
      };
    }

    fragment.closed(({ code }) => {
      $("note").textContent = code === 4004 ? "this pet was deleted" : "this page's access changed: reload it";
    });

    fragment.presence.set({ joined: Date.now() });
    if (me.principal.startsWith("anon:")) {
      // only people signed in drive it (the computer skips anyone else's records)
      const signin = Object.assign(document.createElement("a"), { href: "./__signin?return=/", textContent: "Sign in" });
      $("note").replaceChildren(signin, " to drive it: you can watch now.");
    } else {
      $("screen").classList.remove("watching");
      for (const el of document.querySelectorAll("input, button")) el.disabled = false;
      fragment.presence.on((list) => {
        const others = list.filter((p) => p.id !== me.id).length;
        $("note").textContent = others ? `you and ${others} other${others === 1 ? "" : "s"} here` : "just you here";
      });
    }
  </script>
</body>
</html>
