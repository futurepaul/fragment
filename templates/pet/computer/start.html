<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Hello from your pet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5f0; color: #1d1b16; font: 18px/1.5 system-ui, sans-serif; }
    main { max-width: 30rem; padding: 2rem; }
    h1 { font: 600 2.2rem/1.2 Georgia, serif; margin: 0 0 .5rem; }
    p { color: #5f5a4f; }
    textarea { width: 100%; height: 5rem; padding: .6rem; border: 1px solid #e2ddd2; border-radius: .5rem; font: inherit; background: #fff; }
    a { color: #8a4b2a; }
  </style>
</head>
<body>
  <main>
    <h1>Hi, I'm your pet.</h1>
    <p>I'm a real computer, and everyone who has me open sees this screen. Click anywhere to poke me, type into the box below, or open a web address from above.</p>
    <textarea placeholder="Click here, then type…"></textarea>
    <p>Try <a href="https://en.wikipedia.org/wiki/Special:Random">a random Wikipedia page</a>.</p>
  </main>
</body>
</html>
