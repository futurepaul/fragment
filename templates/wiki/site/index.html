<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wiki</title>
  <style>
    :root { --bg: #f7f5f0; --side: #efece4; --fg: #1d1b16; --muted: #7d776a; --line: #e2ddd2; --accent: #2a5db0; --on-accent: #fff; --missing: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16150f; --side: #1c1a14; --fg: #eeeae0; --muted: #9a9384; --line: #2f2c24; --accent: #8fb3f0; --on-accent: #16150f; --missing: #f0857a; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 ui-sans-serif, system-ui, sans-serif; }
    button { font: inherit; cursor: pointer; border-radius: .45rem; }
    .primary { padding: .45rem .9rem; border: 0; background: var(--accent); color: var(--on-accent); }
    .quiet { padding: .4rem .8rem; border: 1px solid var(--line); background: transparent; color: inherit; }
    .shell { display: grid; grid-template-columns: 16rem minmax(0, 1fr); min-height: 100%; }
    #side { background: var(--side); border-right: 1px solid var(--line); padding: 1.25rem 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .brand { font: 600 1.35rem/1.2 Georgia, serif; color: inherit; text-decoration: none; }
    #side input { width: 100%; padding: .45rem .6rem; border: 1px solid var(--line); border-radius: .45rem; background: var(--bg); color: inherit; font: inherit; font-size: .9rem; }
    #list { list-style: none; margin: 0; padding: 0; font-size: .93rem; }
    #list a { display: block; padding: .25rem .5rem; border-radius: .35rem; color: inherit; text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list a small { color: var(--muted); }
    #list a.on { background: var(--bg); color: var(--accent); font-weight: 500; }
    #new { display: flex; gap: .4rem; }
    #new[hidden] { display: none; }
    #side .foot { margin-top: auto; display: flex; flex-direction: column; gap: .35rem; font-size: .88rem; }
    #side .foot a { color: var(--muted); }
    #side .foot a.on { color: var(--accent); }
    main { padding: 2rem clamp(1.25rem, 4vw, 3.5rem) 4rem; min-width: 0; }
    .top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; max-width: 46rem; margin-bottom: 1.25rem; font-size: .85rem; color: var(--muted); }
    .top .who { display: flex; flex-wrap: wrap; gap: .35rem; align-items: center; }
    .pill { padding: .1rem .5rem; border-radius: 999px; background: var(--line); color: var(--fg); font-size: .78rem; }
    .pill.editing { background: color-mix(in srgb, var(--accent) 18%, transparent); color: var(--accent); }
    #view { max-width: 46rem; font: 400 1.05rem/1.7 Georgia, serif; overflow-wrap: anywhere; }
    #view h1 { font-size: 2.1rem; line-height: 1.2; margin: 0 0 1rem; }
    #view h2 { font-size: 1.45rem; line-height: 1.3; margin: 2rem 0 .6rem; }
    #view h3, #view h4, #view h5, #view h6 { font-size: 1.15rem; margin: 1.5rem 0 .4rem; }
    #view a.wiki, #view a.external { color: var(--accent); text-underline-offset: 2px; }
    #view a.missing { color: var(--missing); text-decoration: underline dashed; text-underline-offset: 3px; }
    #view code { font: .85em ui-monospace, Menlo, monospace; background: var(--line); padding: .05rem .3rem; border-radius: .25rem; }
    #view pre { background: var(--side); border: 1px solid var(--line); border-radius: .5rem; padding: .8rem 1rem; overflow-x: auto; font-size: .85rem; line-height: 1.5; }
    #view pre code { background: none; padding: 0; }
    #view blockquote { margin: 1rem 0; padding-left: 1rem; border-left: 3px solid var(--line); color: var(--muted); }
    #view img { max-width: 100%; border-radius: .4rem; }
    #view li.task { list-style: none; margin-left: -1.2rem; }
    #view .table { overflow-x: auto; }
    #view table { border-collapse: collapse; font: .92rem/1.5 ui-sans-serif, system-ui, sans-serif; }
    #view th, #view td { border: 1px solid var(--line); padding: .35rem .6rem; text-align: left; }
    #view hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
    .empty { color: var(--muted); font-style: italic; }
    #editor { max-width: 46rem; display: flex; flex-direction: column; gap: .6rem; }
    #editor[hidden] { display: none; }
    #editor .bar { display: flex; gap: .5rem; align-items: center; justify-content: flex-end; flex-wrap: wrap; }
    #editor .bar span { margin-right: auto; color: var(--muted); font-size: .85rem; }
    #editor .bar span.warn { color: var(--missing); }
    #text { width: 100%; min-height: 60vh; padding: .9rem 1rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--bg); color: inherit; font: .95rem/1.6 ui-monospace, Menlo, monospace; resize: vertical; }
    #changes { list-style: none; padding: 0; margin: 0; max-width: 46rem; font: .95rem/1.5 ui-sans-serif, system-ui, sans-serif; }
    #changes li { display: grid; grid-template-columns: 7rem minmax(0, 1fr); gap: .75rem; padding: .55rem 0; border-top: 1px solid var(--line); }
    #changes time, #changes small { color: var(--muted); font-size: .82rem; }
    #changes a { color: var(--accent); }
    #error { color: var(--missing); font-size: .85rem; }
    #menu { display: none; }
    @media (max-width: 46rem) {
      .shell { grid-template-columns: 1fr; }
      #side { border-right: 0; border-bottom: 1px solid var(--line); padding: .9rem 1.1rem; gap: .6rem; }
      #side .head { display: flex; align-items: center; justify-content: space-between; }
      #menu { display: block; }
      #side:not(.open) > :not(.head) { display: none; }
      main { padding-top: 1.25rem; }
      #view h1 { font-size: 1.75rem; }
      #changes li { grid-template-columns: 1fr; gap: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <nav id="side">
      <div class="head"><a href="#/home" class="brand" id="brand">Wiki</a> <button class="quiet" id="menu" type="button">Pages</button></div>
      <input id="filter" type="search" placeholder="Find a page" autocomplete="off">
      <ul id="list"></ul>
      <form id="new" hidden><input id="new-title" placeholder="A new page's title" maxlength="100" autocomplete="off"><button class="quiet">New</button></form>
      <div class="foot"><a href="#/_recent" id="recent-link">Recent changes</a></div>
    </nav>
    <main>
      <div class="top"><span id="meta"></span><span class="who" id="who"></span></div>
      <article id="view"></article>
      <form id="editor" hidden>
        <div class="bar"><span id="edit-note"></span><button class="quiet" type="button" id="cancel">Cancel</button><button class="primary" id="save">Save</button></div>
        <textarea id="text" spellcheck="true"></textarea>
      </form>
      <p id="error"></p>
    </main>
  </div>
  <script type="module" src="wiki.js"></script>
</body>
</html>
