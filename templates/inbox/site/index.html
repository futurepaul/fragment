<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox</title>
  <link rel="stylesheet" href="./__fragment.css">
  <style>
    ul { list-style: none; padding: 0; margin: 0 0 1.5rem; }
    li { padding: .6rem 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
    li small { display: block; margin-top: .1rem; }
    li.new { animation: flash 1.2s ease-out; }
    @keyframes flash { from { background: color-mix(in srgb, var(--accent) 22%, transparent); } to { background: transparent; } }
    #how { margin: 0; color: var(--muted); font-size: var(--text-sm); }
    #how code { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <ul id="items"></ul>
    <p id="how">Anything posted to this fragment's inbox shows up here, live. From a terminal:
      <code>fragment inbox &lt;name&gt; --token &lt;inbox token&gt; --payload '{"text":"hello"}'</code>
      (the token is in <code>fragment status &lt;name&gt;</code>). A payload with a <code>url</code> is fetched for its title.</p>
  </main>
  <script type="module">
    import * as fragment from "./__fragment.js";

    let seen = null;
    fragment.live("list", {}, ({ items }) => {
      document.getElementById("items").replaceChildren(...items.map((i) => {
        const li = document.createElement("li");
        if (seen && !seen.has(i.id)) li.className = "new";
        li.append(i.text, Object.assign(document.createElement("small"), { textContent: `${i.source} · ${new Date(i.at).toLocaleString()}` }));
        return li;
      }));
      seen = new Set(items.map((i) => i.id));
    });
  </script>
</body>
</html>
