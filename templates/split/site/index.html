<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Split</title>
  <style>
    :root { --bg: #f7f5f0; --card: #fffdf8; --fg: #1d1b16; --muted: #7c766a; --line: #e4dfd4; --soft: #eeeae1; --accent: #6a4c93; --on-accent: #fff; --tint: #ebe4f3; --bad: #b3261e; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16150f; --card: #1e1d17; --fg: #eeeae0; --muted: #9a9384; --line: #2f2d26; --soft: #26241e; --accent: #c2a8e6; --on-accent: #16150f; --tint: #2d2638; --bad: #f2a49b; } }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 ui-sans-serif, system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
    main { max-width: 64rem; margin: 0 auto; padding: 1.8rem 1.1rem 4rem; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1.2rem 2.5rem; align-items: start; }
    @media (min-width: 52rem) { main { grid-template-columns: minmax(0, 19rem) minmax(0, 1fr); } header, #signin, #join, #error { grid-column: 1 / -1; } }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
    h1 { font: 600 clamp(1.7rem, 5vw, 2.3rem)/1.15 Georgia, serif; margin: 0; overflow-wrap: anywhere; }
    h2 { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 .6rem; }
    #status { margin: .35rem 0 0; color: var(--muted); font-size: .92rem; }
    .faces { display: flex; flex: none; }
    .face { width: 2rem; height: 2rem; border-radius: 50%; border: 2px solid var(--bg); margin-left: -.45rem; display: grid; place-items: center; font-size: .75rem; font-weight: 600; background: var(--tint); color: var(--accent); }
    .faces .face:first-child { margin-left: 0; }
    a, .link { color: var(--accent); }
    .link { border: 0; background: none; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
    button { font: inherit; color: inherit; cursor: pointer; }
    input, select { width: 100%; min-width: 0; padding: .55rem .7rem; border: 1px solid var(--line); border-radius: .5rem; background: var(--card); color: inherit; font: inherit; }
    input:focus-visible, select:focus-visible, button:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
    .box { background: var(--card); border: 1px solid var(--line); border-radius: .8rem; padding: 1rem; }
    .primary { border: 0; border-radius: .5rem; padding: .6rem 1.1rem; background: var(--accent); color: var(--on-accent); font-weight: 600; }
    .ghost { border: 1px solid var(--line); background: var(--card); border-radius: .5rem; padding: .55rem .9rem; }
    #error { color: var(--bad); margin: 0; font-size: .9rem; }
    #error:empty { display: none; }
    #join { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
    #join p { flex: 1 1 100%; margin: 0; }
    #join input { flex: 1 1 12rem; width: auto; }
    .side { display: grid; gap: 1.2rem; }
    #you .big { font: 600 2rem/1.1 Georgia, serif; margin: .1rem 0 .2rem; font-variant-numeric: tabular-nums; }
    #you .big.owed { color: var(--accent); }
    #you .said { color: var(--muted); margin: 0; }
    .pays { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
    .pays li { display: flex; align-items: center; gap: .5rem; font-size: .95rem; }
    .pays li span { flex: 1; }
    .pays button { border: 1px solid var(--accent); color: var(--accent); background: none; border-radius: 2rem; padding: .2rem .7rem; font-size: .85rem; }
    .people { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
    .people li { display: flex; align-items: center; gap: .55rem; }
    .people .face { width: 1.7rem; height: 1.7rem; border: 0; margin: 0; font-size: .7rem; }
    .people .n { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
    .people .n.owed { color: var(--accent); font-weight: 600; }
    .mainc { display: grid; gap: 1.2rem; min-width: 0; }
    #add { display: grid; gap: .65rem; }
    .two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 8rem); gap: .6rem; }
    .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
    .row label.paid { display: flex; align-items: center; gap: .5rem; color: var(--muted); font-size: .9rem; flex: 1 1 12rem; white-space: nowrap; }
    .chips { display: flex; flex-wrap: wrap; gap: .4rem; }
    .chips label { border: 1px solid var(--line); border-radius: 2rem; padding: .25rem .75rem; font-size: .88rem; cursor: pointer; color: var(--muted); }
    .chips label:has(input:checked) { border-color: var(--accent); background: var(--tint); color: var(--fg); }
    .chips input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .snap { border: 1px dashed var(--accent); color: var(--accent); border-radius: .5rem; padding: .55rem .9rem; cursor: pointer; text-align: center; }
    #scan { margin: 0; color: var(--muted); font-size: .9rem; }
    #scan:empty { display: none; }
    #expenses { list-style: none; margin: 0; padding: 0; }
    #expenses li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: .2rem .8rem; align-items: baseline; padding: .75rem 0; border-bottom: 1px solid var(--line); }
    #expenses .what { font-weight: 600; overflow-wrap: anywhere; }
    #expenses .amt { font-variant-numeric: tabular-nums; }
    #expenses .meta { grid-column: 1 / 2; color: var(--muted); font-size: .85rem; }
    #expenses .payment .what { font-weight: 400; color: var(--muted); }
    #expenses details { grid-column: 1 / -1; font-size: .88rem; color: var(--muted); }
    #expenses details ul { margin: .35rem 0 0; padding-left: 1.1rem; }
    #expenses .x { border: 0; background: none; color: var(--muted); padding: 0 .2rem; font-size: 1.05rem; }
    .quiet { color: var(--muted); font-size: .9rem; margin: 0; }
    #signin { margin: 0; }
    /* on a phone: your balance, then the form, then the rest */
    @media (max-width: 51.99rem) { .side, .mainc { display: contents; } #you { order: 1; } #add { order: 2; } #settle { order: 3; } #everyone { order: 4; } #spent { order: 5; } }
    #about { display: grid; grid-template-columns: minmax(0, 1fr) 5rem auto; gap: .5rem; margin-top: .6rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1 id="title">Split</h1>
        <p id="status">connecting…</p>
        <form id="about" hidden><input id="atitle" maxlength="80" required placeholder="Lisbon trip"><input id="acur" maxlength="3" required placeholder="EUR"><button class="primary">Save</button></form>
      </div>
      <div class="faces" id="here"></div>
    </header>
    <p id="signin" hidden>You can look. <a href="./__signin?return=/">Sign in</a> to join the split.</p>
    <form id="join" class="box" hidden><p>Are you in on these costs?</p><input id="jname" maxlength="40" required placeholder="Your name"><button class="primary">I'm in</button></form>
    <p id="error" role="status"></p>
    <div class="side">
      <section id="you" class="box" hidden><h2>You</h2><p class="big" id="mine"></p><p class="said" id="mineSaid"></p></section>
      <section id="settle" hidden><h2>To settle up</h2><ul class="pays" id="pays"></ul></section>
      <section id="everyone"><h2>Everyone</h2><ul class="people" id="people"></ul><p class="quiet" id="nobody">No one has joined yet.</p></section>
    </div>
    <div class="mainc">
      <form id="add" class="box" hidden>
        <div class="two"><input id="what" maxlength="120" required placeholder="What for"><input id="amount" inputmode="decimal" required placeholder="0.00"></div>
        <div class="row"><label class="paid">Paid by <select id="payer"></select></label></div>
        <div class="chips" id="among"></div>
        <div class="row"><button class="primary">Add</button><label class="snap">Snap a receipt<input type="file" id="receipt" accept="image/*" capture="environment" hidden></label></div>
        <p id="scan" role="status"></p>
      </form>
      <section id="spent"><h2>Expenses</h2><ul id="expenses"></ul><p class="quiet" id="none">Nothing spent yet.</p></section>
    </div>
  </main>
  <script type="module">
    import * as fragment from "./__fragment.js";

    const $ = (id) => document.getElementById(id);
    const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
    const show = (e) => { $("error").textContent = e ? e.message : ""; };
    const initial = (name) => ([...(name ?? "?").trim()][0] ?? "?").toUpperCase();
    const IMAGE_MAX = 240000; // the scan's input holds at most this much base64

    let L = null;              // the last ledger
    const opened = Date.now();

    // who this page is first: a visitor with no cookie is given one by the
    // socket, and a call sent beside it would be given another
    const me = await fragment.me();
    const signedIn = me.principal.startsWith("id:");
    const editor = me.role === "editor" || me.role === "owner";
    $("signin").hidden = signedIn;
    if (signedIn) fetch(`./__people?id=${encodeURIComponent(me.principal)}`).then((r) => r.json()).then((p) => { $("jname").value ||= p.profiles?.[me.principal]?.username ?? ""; }).catch(() => {});

    const money = (cents) => new Intl.NumberFormat(undefined, { style: "currency", currency: L?.currency || "USD" }).format(cents / 100);
    const nameOf = (id) => (id === me.principal ? "you" : L?.people.find((p) => p.id === id)?.name ?? "someone");
    const Name = (id) => (id === me.principal ? "You" : nameOf(id));
    function ago(at) {
      const s = (Date.now() - at) / 1000;
      if (s < 60) return "just now";
      if (s < 3600) return `${Math.floor(s / 60)} min ago`;
      if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
      return new Date(at).toLocaleDateString(undefined, { day: "numeric", month: "short" });
    }

    function render() {
      const joined = L.people.some((p) => p.id === me.principal);
      $("title").textContent = L.title || "Split";
      document.title = L.title || "Split";
      $("status").replaceChildren(`${money(L.spent)} spent by ${L.people.length} ${L.people.length === 1 ? "person" : "people"}.`, editor ? " " : "",
        editor ? el("button", { className: "link", textContent: L.title ? "Edit" : "Name it", onclick: () => { $("about").hidden = false; $("atitle").value = L.title; $("acur").value = L.currency; } }) : "");
      $("join").hidden = !signedIn || joined;
      $("add").hidden = !joined;
      $("you").hidden = !joined;

      // you, and the payments that settle up
      const mine = L.people.find((p) => p.id === me.principal);
      if (mine) {
        $("mine").textContent = mine.balance === 0 ? "Square" : money(Math.abs(mine.balance));
        $("mine").className = `big${mine.balance > 0 ? " owed" : ""}`;
        $("mineSaid").textContent = mine.balance > 0 ? "is owed to you." : mine.balance < 0 ? "is yours to pay back." : "You owe nothing, and no one owes you.";
      }
      $("settle").hidden = L.settle.length === 0;
      const yours = (s) => s.from === me.principal || s.to === me.principal;
      const pays = [...L.settle].sort((a, b) => yours(b) - yours(a));
      $("pays").replaceChildren(...pays.map((s) => el("li", {}, el("span", { textContent: `${Name(s.from)} ${s.from === me.principal ? "pay" : "pays"} ${nameOf(s.to)} ${money(s.cents)}` }),
        s.from === me.principal ? el("button", { textContent: "Mark paid", onclick: () => fragment.call("settle", { to: s.to, cents: s.cents }).then(() => show(), show) }) : "")));

      $("people").replaceChildren(...L.people.map((p) => el("li", {}, el("span", { className: "face", textContent: initial(p.name) }), el("span", { textContent: p.id === me.principal ? `${p.name} (you)` : p.name }),
        el("span", { className: `n${p.balance > 0 ? " owed" : ""}`, textContent: p.balance === 0 ? "square" : `${p.balance > 0 ? "+" : "−"}${money(Math.abs(p.balance))}` }))));
      $("nobody").hidden = L.people.length > 0;

      // the form's people, kept as chosen across redraws
      const payer = $("payer").value || me.principal;
      $("payer").replaceChildren(...L.people.map((p) => el("option", { value: p.id, textContent: p.id === me.principal ? "you" : p.name })));
      $("payer").value = L.people.some((p) => p.id === payer) ? payer : me.principal;
      const unticked = new Set([...$("among").querySelectorAll("input:not(:checked)")].map((i) => i.value));
      $("among").replaceChildren(el("span", { className: "quiet", textContent: "Split between" }), ...L.people.map((p) => el("label", {}, el("input", { type: "checkbox", value: p.id, checked: !unticked.has(p.id) }), p.id === me.principal ? "you" : p.name)));

      $("expenses").replaceChildren(...L.expenses.map((e) => {
        const li = el("li", { className: e.kind });
        li.dataset.id = e.id;
        const meta = e.kind === "payment" ? `${Name(e.paidBy)} paid ${nameOf(e.among[0])} · ${ago(e.at)}` : `${Name(e.paidBy)} paid · split ${e.among.length === L.people.length ? "between everyone" : `between ${e.among.map(nameOf).join(", ")}`} · ${ago(e.at)}`;
        const mineToRemove = [e.paidBy, e.by].includes(me.principal) || editor;
        li.append(el("span", { className: "what", textContent: e.kind === "payment" ? "Payment" : e.what }), el("span", { className: "amt", textContent: money(e.cents) }),
          mineToRemove ? el("button", { className: "x", title: "Remove", textContent: "×", onclick: () => fragment.call("remove", { id: e.id }).then(() => show(), show) }) : el("span"),
          el("span", { className: "meta", textContent: meta }));
        if (e.lines.length) li.append(el("details", {}, el("summary", { textContent: `${e.lines.length} line${e.lines.length === 1 ? "" : "s"} from the receipt` }), el("ul", {}, ...e.lines.map((l) => el("li", { textContent: `${l.name}: ${money(l.cents)}` })))));
        return li;
      }));
      $("none").hidden = L.expenses.length > 0;
    }

    fragment.live("ledger", {}, (l) => { L = l; render(); }, show);

    // what a scan of yours said, from here on
    fragment.subscribe("scans", (r) => { if (r.body?.for === me.principal && r.at >= opened) $("scan").textContent = r.body.text; }, { last: 1 });

    $("join").onsubmit = async (e) => { e.preventDefault(); try { await fragment.call("join", { name: $("jname").value.trim() }); show(); } catch (err) { show(err); } };
    $("about").onsubmit = async (e) => { e.preventDefault(); try { await fragment.call("about", { title: $("atitle").value.trim(), currency: $("acur").value.trim() }); $("about").hidden = true; show(); } catch (err) { show(err); } };
    $("add").onsubmit = async (e) => {
      e.preventDefault();
      const cents = Math.round(parseFloat($("amount").value.replace(",", ".")) * 100);
      if (!(cents > 0)) return show(new Error("An amount, like 12.50."));
      const among = [...$("among").querySelectorAll("input:checked")].map((i) => i.value);
      if (!among.length) return show(new Error("Split it between someone."));
      try {
        await fragment.call("add", { what: $("what").value.trim(), cents, paidBy: $("payer").value, among });
        $("what").value = $("amount").value = "";
        show();
      } catch (err) { show(err); }
    };

    // a receipt photo as a JPEG small enough for the scan's input (a
    // phone's camera makes several MB), then read by the scan job
    $("receipt").onchange = async () => {
      const file = $("receipt").files[0];
      $("receipt").value = "";
      if (!file) return;
      $("scan").textContent = "Reading your receipt…";
      try {
        const bitmap = await createImageBitmap(file);
        let image = null;
        for (const side of [1600, 1280, 1024, 800]) {
          const scale = Math.min(1, side / Math.max(bitmap.width, bitmap.height));
          const canvas = el("canvas", { width: Math.round(bitmap.width * scale), height: Math.round(bitmap.height * scale) });
          canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
          for (const q of [0.8, 0.65, 0.5]) {
            const url = canvas.toDataURL("image/jpeg", q);
            if (url.length - url.indexOf(",") - 1 <= IMAGE_MAX) { image = url.slice(url.indexOf(",") + 1); break; }
          }
          if (image) break;
        }
        if (!image) throw new Error("That photo is too big to read.");
        await fragment.call("scan", { image });
      } catch (err) { $("scan").textContent = ""; show(err); }
    };

    fragment.presence.set({});
    fragment.presence.on((list) => {
      const here = [...new Set(list.map((p) => p.principal))];
      $("here").replaceChildren(...here.slice(0, 6).map((id) => el("span", { className: "face", title: Name(id), textContent: id.startsWith("id:") ? initial(Name(id)) : "?" })));
    });
    fragment.closed(({ code }) => { $("status").textContent = code === 4004 ? "This split was deleted." : "This page's access changed: reload it."; });
  </script>
</body>
</html>
