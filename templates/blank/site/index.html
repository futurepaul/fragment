<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blank</title>
  <style>
    :root { --bg: #f7f5f0; --fg: #1d1b16; --muted: #857f72; }
    @media (prefers-color-scheme: dark) { :root { --bg: #16150f; --fg: #eeeae0; --muted: #9a9384; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 34rem; margin: 3rem auto; padding: 0 1rem; }
    h1 { font: 600 1.6rem/1.2 Georgia, serif; margin: 0 0 .5rem; }
    p { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>A blank fragment</h1>
    <p>Edit <code>site/index.html</code> to make this page yours.</p>
  </main>
</body>
</html>
