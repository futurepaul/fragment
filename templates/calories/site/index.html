<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calories</title>
  <link rel="stylesheet" href="./__fragment.css">
  <style>
    #note { margin-bottom: .75rem; color: var(--muted); font-size: var(--text-sm); }
    form { display: flex; gap: .5rem; }
    form input { flex: 1; }
    #answer { min-height: 1.5rem; margin: .75rem 0 1rem; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: .6rem; min-height: 2.5rem; border-bottom: 1px solid var(--line); }
    li span:first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    li span:nth-child(2) { color: var(--muted); font-variant-numeric: tabular-nums; }
    li button { min-height: 0; width: 2rem; height: 2rem; padding: 0; background: none; color: var(--faint); font-weight: 400; }
    li button:hover { background: var(--soft); color: var(--fg); }
    #total { margin: 1rem 0; font-weight: 600; font-variant-numeric: tabular-nums; }
    #summarize { background: none; color: var(--fg); border: 1px solid var(--line-strong); }
  </style>
</head>
<body>
  <main>
    <div id="note">connecting…</div>
    <form id="ask"><input id="text" placeholder="What did you eat? (2 eggs and toast)" maxlength="500" autocomplete="off" disabled><button>Log</button></form>
    <div id="answer"></div>
    <ul id="entries"></ul>
    <div id="total"></div>
    <button id="summarize" hidden>Sum up my day</button>
  </main>
  <script type="module">
    import * as fragment from "./__fragment.js";

    const $ = (id) => document.getElementById(id);
    const el = (tag, text) => Object.assign(document.createElement(tag), { textContent: text });
    const midnight = new Date().setHours(0, 0, 0, 0);
    let me = null;
    // each person's newest answer (`replies`: heard's and summarize's)
    const answers = new Map();

    fragment.live("today", { since: midnight }, ({ entries, total }) => {
      $("entries").replaceChildren(...entries.map((e) => {
        const li = document.createElement("li");
        const x = Object.assign(el("button", "×"), { title: "Forget it" });
        x.onclick = () => fragment.call("forget", { id: e.id }).catch((err) => ($("answer").textContent = err.message));
        li.append(el("span", e.food), el("span", `${e.calories} kcal`), x);
        return li;
      }));
      $("total").textContent = `${total} kcal today`;
    }, (err) => ($("answer").textContent = err.message));

    const shown = () => {
      const text = answers.get(me?.principal);
      if (text) $("answer").textContent = text;
    };
    fragment.subscribe("replies", (r) => {
      answers.set(r.body.for, r.body.text);
      shown();
    }, { last: 200 });

    fragment.me().then((hello) => {
      me = hello;
      if (hello.principal.startsWith("anon:")) {
        const a = Object.assign(el("a", "Sign in"), { href: "./__signin?return=/" });
        $("note").replaceChildren(a, " to log what you eat.");
        return;
      }
      $("note").textContent = "Say what you ate; it is logged for you.";
      $("text").disabled = false;
      $("summarize").hidden = false;
      shown();
    });

    $("summarize").onclick = () => {
      $("answer").textContent = "Summing up…";
      fragment.call("summarize", {}).catch((err) => ($("answer").textContent = err.message));
    };

    $("ask").onsubmit = async (e) => {
      e.preventDefault();
      const text = $("text").value.trim();
      if (!text) return;
      try {
        await fragment.post("ask", { text });
        $("text").value = "";
        $("answer").textContent = "Logging…";
      } catch (err) {
        $("answer").textContent = err.message;
      }
    };
  </script>
</body>
</html>
