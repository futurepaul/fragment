<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="./__fragment.css">
  <style>
    #here { margin: 0 0 .75rem; color: var(--muted); font-size: var(--text-sm); }
    form { display: flex; gap: .5rem; }
    form input { flex: 1; }
    #error { min-height: 1.25rem; margin: .25rem 0; color: var(--danger); font-size: var(--text-sm); }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; gap: .65rem; min-height: 2.75rem; padding: .35rem 0; border-bottom: 1px solid var(--line); }
    li input { width: 1.05rem; height: 1.05rem; margin: 0; flex: none; }
    li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    li.done span { color: var(--faint); text-decoration: line-through; }
    .x { min-height: 0; width: 2rem; height: 2rem; padding: 0; background: none; color: var(--faint); font-size: 1.15rem; font-weight: 400; }
    .x:hover { background: var(--soft); color: var(--fg); }
    #empty { margin: 1rem 0; color: var(--faint); }
    #activity { margin-top: 1.5rem; color: var(--faint); font-size: var(--text-sm); }
    #activity div { padding: .1rem 0; }
  </style>
</head>
<body>
  <main>
    <div id="here">connecting…</div>
    <form id="add"><input type="text" id="text" placeholder="What needs doing?" maxlength="200" autocomplete="off"><button>Add</button></form>
    <div id="error"></div>
    <ul id="todos"></ul>
    <p id="empty" hidden>Nothing to do yet.</p>
    <div id="activity"></div>
  </main>
  <script type="module">
    import * as fragment from "./__fragment.js";

    const $ = (id) => document.getElementById(id);
    const show = (e) => { $("error").textContent = e ? e.message : ""; };

    fragment.live("list", {}, ({ todos }) => {
      $("empty").hidden = todos.length > 0;
      $("todos").replaceChildren(...todos.map((t) => {
        const li = document.createElement("li");
        li.className = t.done ? "done" : "";
        li.dataset.id = t.id;
        const box = Object.assign(document.createElement("input"), { type: "checkbox", checked: t.done });
        box.onchange = () => fragment.call("toggle", { id: t.id }).then(() => show(), show);
        const text = Object.assign(document.createElement("span"), { textContent: t.text });
        const x = Object.assign(document.createElement("button"), { className: "x", textContent: "×", title: "Remove" });
        x.onclick = () => fragment.call("remove", { id: t.id }).then(() => show(), show);
        li.append(box, text, x);
        return li;
      }));
    }, show);

    $("add").onsubmit = async (e) => {
      e.preventDefault();
      const text = $("text").value.trim();
      if (!text) return;
      try {
        await fragment.call("add", { text });
        $("text").value = "";
        show();
      } catch (err) {
        show(err);
      }
    };

    // the last 20 lines of activity, then live
    fragment.subscribe("activity", (r) => {
      const line = document.createElement("div");
      line.textContent = `${r.body.did} “${r.body.text}”`;
      $("activity").prepend(line);
      while ($("activity").children.length > 20) $("activity").lastChild.remove();
    }, { last: 20 });

    // the fragment ended this page's connection for good
    fragment.closed(({ code }) => {
      $("here").textContent = code === 4004 ? "this list was deleted" : "this page's access changed: reload it";
    });

    const me = await fragment.me();
    fragment.presence.set({ joined: Date.now() });
    fragment.presence.on((list) => {
      const others = list.filter((p) => p.id !== me.id).length;
      $("here").textContent = others ? `you and ${others} other${others === 1 ? "" : "s"} here` : "just you here";
    });
  </script>
</body>
</html>
