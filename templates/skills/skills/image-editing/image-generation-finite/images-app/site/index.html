<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Images</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem; color: #1d1d1f; }
  main { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
  figure { margin: 0; } img { width: 100%; border-radius: 8px; } figcaption { font-size: 12px; color: #6e6e73; }
</style>
</head>
<body>
<h1>Images</h1>
<main id="grid"><p>Loading…</p></main>
<script type="module">
  // every JPEG under images/: the fragment's own files, served by __file
  const r = await fetch("./__files", { headers: { accept: "application/json" } });
  const listed = r.ok ? await r.json() : { files: [] };
  const grid = document.getElementById("grid");
  const files = (listed.files ?? []).filter((f) => f.path.startsWith("images/") && /\.jpe?g$/.test(f.path));
  grid.replaceChildren(...(files.length ? files.map((f) => {
    const fig = document.createElement("figure");
    const img = document.createElement("img");
    img.src = `./__file?path=${encodeURIComponent(f.path)}`;
    img.alt = f.path;
    const cap = document.createElement("figcaption");
    cap.textContent = f.path;
    fig.append(img, cap);
    return fig;
  }) : [Object.assign(document.createElement("p"), { textContent: "No images yet." })]));
</script>
</body>
</html>
