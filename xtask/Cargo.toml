[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fragment-core = { path = "../crates/core" }
fragment-devstack = { path = "../crates/devstack" }
# `dev --lan`: the CA, Dex, and the front door with DNS (lan.rs)
fragment-lan = { path = "../crates/lan" }
fragment-fakes = { path = "../crates/fakes" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
