[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fragment-core = { path = "../crates/core" }
fragment-proto = { path = "../crates/proto" }
fragment-devstack = { path = "../crates/devstack" }
# the release's files, written into the cell's Static Assets at each build (build.rs)
fragment-templates = { path = "../crates/templates", features = ["embed"] }
fragment-fakes = { path = "../crates/fakes" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
