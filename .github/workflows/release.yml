name: release
# Binary releases from tags: push v0.9.0 and CI builds the tarballs,
# attaches them, and publishes the release as the latest. Each tarball is
# fragment-<uname -s>-<uname -m>.tar.gz holding one binary, `fragment`, so
# the one-line install (cli/SKILL.md) fetches
# releases/latest/download/fragment-$(uname -s)-$(uname -m).tar.gz;
# `cargo xtask check` holds the matrix and that command to each other.
# Hand-written release notes can live in a draft release created before
# tagging; if none exists the workflow falls back to --generate-notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: Darwin-arm64
          - os: macos-14
            target: x86_64-apple-darwin
            asset: Darwin-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: Linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release -p fragment-cli --target ${{ matrix.target }}
      - name: package
        # macOS's tar adds no AppleDouble `._fragment` beside the binary
        env:
          COPYFILE_DISABLE: 1
        run: tar -czf "$RUNNER_TEMP/fragment-${{ matrix.asset }}.tar.gz" -C "target/${{ matrix.target }}/release" fragment
      - uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.asset }}
          path: ${{ runner.temp }}/fragment-${{ matrix.asset }}.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --title "fragment $tag" --generate-notes
          fi
          # published, and the latest: the install command fetches from releases/latest
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
