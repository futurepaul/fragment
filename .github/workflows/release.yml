name: release
# Binary releases from tags: push v0.6.0 and CI builds + attaches both
# tarballs. Hand-written release notes live in a draft release created
# before tagging; if none exists the workflow falls back to --generate-notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        run: cargo build --release --target ${{ matrix.target }}
        working-directory: cli
      - name: package
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd "cli/target/${{ matrix.target }}/release"
          cp fragment "fragment-${v}-${{ matrix.target }}"
          tar -czf "$RUNNER_TEMP/fragment-${v}-${{ matrix.target }}.tar.gz" "fragment-${v}-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: fragment-${{ matrix.target }}
          path: ${{ runner.temp }}/fragment-*.tar.gz
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: attach
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" \
              --draft --title "fragment $tag" --generate-notes
          fi
