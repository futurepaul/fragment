# The computer images' Rust (images/: the bridge and hermes-boot,
# docs/bridge.md): its own workspace, so its own job. Host tests and clippy,
# warnings denied. The Docker lane (images/bridge/tests/docker.rs, real
# Hermes included) builds 4 GB of images and is run by hand:
# `cargo test -p fragment-bridge --test docker -- --ignored`.
name: images

on:
  push:
    branches: [master]
    paths: ["images/**", "cli/SKILL.md", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", "cli/SKILL.md", ".github/workflows/images.yml"]

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            images/target
          key: images-${{ runner.os }}-${{ hashFiles('images/Cargo.lock') }}
          restore-keys: images-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
