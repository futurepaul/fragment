# The computer images' Rust (images/: the bridge and hermes-boot,
# docs/bridge.md): its own workspace, so its own jobs.
#
# - `check`: host tests and clippy, warnings denied, on every change here.
# - `docker`: the Docker lane (images/bridge/tests/docker.rs): both images
#   built for linux/amd64 and run in Docker against the fake API and a
#   scripted model, real Hermes included (`cargo test -p fragment-bridge
#   --test docker -- --ignored`). It runs only when a change touches what it
#   builds or runs (`changes` below: images/hermes, images/bridge,
#   images/stub, the images' manifest and lock, or this workflow), on pull
#   requests and on master's pushes, and on every run by hand.
name: images

on:
  push:
    branches: [master]
    paths: ["images/**", "cli/SKILL.md", ".github/workflows/images.yml"]
  pull_request:
    paths: ["images/**", "cli/SKILL.md", ".github/workflows/images.yml"]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: images
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            images/target
          key: images-${{ runner.os }}-${{ hashFiles('images/Cargo.lock') }}
          restore-keys: images-${{ runner.os }}-
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Whether the Docker lane runs: a change to what it builds or runs. Its own
  # job, since a job's `if` reads only another job's outputs. The changed
  # files are the pull request's (as its `paths` filter reads them), or the
  # push's from its `before`; a push the compare cannot list whole (a new
  # branch, 300 files or more) and a run by hand run the lane.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          lane='^(images/(hermes|bridge|stub)/|images/Cargo\.(toml|lock)$|\.github/workflows/images\.yml$)'
          if [ "$EVENT" = pull_request ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          elif [ "$EVENT" = push ] && [ -n "${BEFORE//0/}" ]; then
            files=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')
            [ "$(printf '%s\n' "$files" | grep -c .)" -lt 300 ] || files=".github/workflows/images.yml"
          else
            files=".github/workflows/images.yml"
          fi
          printf 'changed:\n%s\n' "$files"
          if printf '%s\n' "$files" | grep -qE "$lane"; then echo docker=true; else echo docker=false; fi | tee -a "$GITHUB_OUTPUT"

  # The Docker lane. The images are built first, each with BuildKit's layers
  # kept in the Actions cache (its own scope; restored on every run, saved
  # only from master's pushes, as ci.yml's caches are), loaded into the
  # runner's Docker under the tags the tests run, then the tests run with
  # FRAGMENT_DOCKER_SKIP_BUILD. The Hermes image is about 3.9 GB in one
  # layer (images/hermes/Dockerfile's last stage), so the build needs more
  # disk than the runner has free: toolchains this job never uses are
  # removed first, and BuildKit's own copy of what it built is dropped once
  # Docker holds the images. The tests' container logs are kept on failure.
  docker:
    name: docker (real Hermes)
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: images
    env:
      # TEMPORARY (measuring a warm run on the PR; removed before review)
      CACHE_SAVE: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.head_ref == 'claude/ci-docker-lane' }}
    steps:
      - name: the runner
        working-directory: .
        run: |
          nproc; free -g; df -h; docker info --format '{{.ServerVersion}} {{.Driver}} {{.DockerRootDir}}'
          sudo du -sh /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift 2>/dev/null || true
      # toolchains no step here uses: Android's SDK, .NET, Haskell, CodeQL's
      # bundle, Swift
      - name: free disk
        working-directory: .
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # the check job's cache (the registry and images/target), read only
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            images/target
          key: images-${{ runner.os }}-${{ hashFiles('images/Cargo.lock') }}
          restore-keys: images-${{ runner.os }}-
      - run: cargo test -p fragment-bridge --test docker --locked --no-run
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: build the stub image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images
          file: images/stub/Dockerfile
          platforms: linux/amd64
          tags: fragment-stub:test
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=docker-stub
          cache-to: ${{ env.CACHE_SAVE == 'true' && 'type=gha,scope=docker-stub,mode=max,ignore-error=true' || '' }}
      - name: build the Hermes image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/hermes/Dockerfile
          platforms: linux/amd64
          tags: fragment-hermes:test
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=docker-hermes
          cache-to: ${{ env.CACHE_SAVE == 'true' && 'type=gha,scope=docker-hermes,mode=max,ignore-error=true' || '' }}
      # Docker holds the images now: BuildKit's copy goes (its cache is saved)
      - name: drop the builder's copy
        run: |
          docker buildx prune --builder ${{ steps.buildx.outputs.name }} --all --force > /dev/null
          docker image ls; docker system df; df -h /
      - name: the Docker lane
        run: cargo test -p fragment-bridge --test docker --locked -- --ignored --show-output
        env:
          FRAGMENT_DOCKER_SKIP_BUILD: "1"
          RUST_BACKTRACE: "1"
      - if: always()
        name: disk after
        run: docker system df; df -h /
      # each container's log (Container's drop) and the tests' own
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-lane-logs
          path: images/target/tmp/**/*.log
          retention-days: 7
