# fragment CI on Linux: `cargo xtask check` (every first-party JavaScript
# file through `node --check` on the pinned Node, host tests and clippy on
# host and wasm, warnings denied), and `cargo xtask e2e`: the cell under
# `wrangler dev` (workerd), with fakes only at the vendor boundaries
# (docs/cloudflare-v1.md, phase 2). The celld e2e on macOS is at tag
# celld-final.
#
# The e2e runs in four shards (crates/e2e/src/lanes/mod.rs, SHARDS: every
# section in exactly one, a host test checks), each on a runner of its own
# with its own build and node; the `e2e` job is green when every shard is.
#
# Caches are restored on every run and saved only from master's pushes
# (a PR reads master's, and so does production's): each key names what it
# holds below. A save comes right after the step that fills it, so a red
# e2e still saves its build.
#
# A green push deploys (`deploy`, below): master's to the preview,
# production's to production.
name: ci

on:
  push:
    branches: [master, production]
  pull_request:
  workflow_dispatch:

# a pull request's newer run cancels its older one; a push's run is never
# cancelled, as it may be deploying: a newer push's waits for it (and
# replaces one already waiting)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # the registry and the debug, test and clippy builds of the two
      # workspaces; a new rustc or lockfile is a new key
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/tools
            cell/target
          key: check-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      # the pinned Node `node --check` runs on, unpacked: the e2e's key,
      # which its first shard saves from master
      - uses: actions/cache/restore@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      - run: cargo xtask check
      # the same paths as the restore (they are part of the cache's version)
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/tools
            cell/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # the registry, and what the e2e's build compiles: the CLI and the
      # suite (target/release), xtask (target/debug), and the cell's
      # wasm32 builds; a new rustc or lockfile is a new key
      - id: cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/debug
            cell/target
          key: e2e-cargo-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock') }}
          restore-keys: e2e-cargo-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      # worker-build itself, and the tools it fetches (wasm-bindgen at the
      # lockfile's version, wasm-opt, esbuild)
      - id: worker-build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
          key: worker-build-0.8.5-${{ runner.os }}-${{ hashFiles('cell/Cargo.lock') }}
          restore-keys: worker-build-0.8.5-${{ runner.os }}-
      # no setup-node: xtask fetches the pinned Node into target/tools
      # (crates/devstack/src/node_release.rs, checked by its SHA-256) and
      # runs its own npm ci; the runner's node is never used. A new pin is
      # a new key.
      - id: node
        uses: actions/cache/restore@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      # what the JavaScript caches (target/cache): npm's tarballs, wrangler's
      # own, and the Chrome for Testing Browser Rendering downloads, which
      # the lockfile's miniflare names
      - id: js
        uses: actions/cache/restore@v4
        with:
          path: target/cache
          key: js-cache-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs', 'package-lock.json') }}
      - run: worker-build --version | grep -q 0.8.5 || cargo install worker-build --version 0.8.5 --locked
      # the cell, the CLI and the suite, and the computer images the
      # node's boot builds (xtask/src/build.rs), all at once
      - run: cargo xtask e2e --build-only
      - if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/debug
            cell/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.worker-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
          key: ${{ steps.worker-build.outputs.cache-primary-key }}
      - if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.node.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/tools
          key: ${{ steps.node.outputs.cache-primary-key }}
      # one shard's sections on a fresh node; the run's scratch (each node
      # boot's log, the lanes' screenshots) is kept when a check fails, and
      # uploaded below
      - run: cargo xtask e2e --no-build --shard ${{ matrix.shard }}/4
        env:
          CHROME_BIN: /usr/bin/google-chrome
      # after the run, from any shard that shot a preview card: miniflare
      # fetches its Chrome for the first one during the run (the first
      # shard to save wins; the others find the key taken)
      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.js.outputs.cache-hit != 'true' && hashFiles('target/cache/.wrangler/chrome/**/.miniflare-install-complete') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cache
          key: ${{ steps.js.outputs.cache-primary-key }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scratch-${{ matrix.shard }}
          path: target/e2e/
          retention-days: 7

  # the check named `e2e`: green when every shard is (a re-run's, by each
  # shard's latest attempt). It runs whatever the shards did (unless the run
  # was cancelled), so a red shard makes it red, never skipped.
  e2e:
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "${{ needs.e2e-shard.result }}" = success || { echo "a shard's job failed (${{ needs.e2e-shard.result }}); its log says where"; exit 1; }

  # Continuous deployment, on a green push: master's to the preview
  # (`--branch preview`), production's to production. Only Paul updates
  # `production` (a protected branch): his push, or the pull request he
  # merges into it, is the approval. Each deploys from a GitHub environment
  # of its name, `preview` or `production`, which the repo's settings let
  # only its branch use, and which holds the variable DEPLOY_HOST (its
  # platform's host) and the secrets DEPLOY_CONFIG (the whole deploy
  # config, JSONC: names and paths, a secret only so the public repo's
  # logs never show it; in base64, below), CLOUDFLARE_API_TOKEN
  # (wrangler's, and the DNS token), the preview's PREVIEW_TEST_SECRET,
  # and, optional, CLOUDFLARE_ACCOUNT_ID (below). Every computer image is
  # pinned by digest (`--pinned-only`): a runner builds none
  # (xtask/src/deploy.rs, `pinned_only`, says why).
  deploy:
    needs: [check, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/production')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment: ${{ github.ref_name == 'production' && 'production' || 'preview' }}
    # one deploy at a time to each, never cancelled mid-way
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      # the deploy reads its commit, and needs no git credentials
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # restored, never saved here: the e2e's keys, as a deploy builds what
      # the e2e's build does (xtask in target/debug, the cell's wasm32
      # builds in cell/target); the same paths as its restores (they are
      # part of each cache's version)
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/debug
            cell/target
          key: e2e-cargo-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock') }}
          restore-keys: e2e-cargo-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
          key: worker-build-0.8.5-${{ runner.os }}-${{ hashFiles('cell/Cargo.lock') }}
          restore-keys: worker-build-0.8.5-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      - run: worker-build --version | grep -q 0.8.5 || cargo install worker-build --version 0.8.5 --locked
      # the config, and the two files it reads by path, at the paths a CI
      # config names (deploy/example.jsonc): the token, its DNS token too,
      # and the preview's test secret, each 0600. printf is the shell's
      # own, so no value is ever a process's argument, and nothing here
      # echoes one. The config is set as one line of base64 (`base64 -w0 <
      # <file> | gh secret set DEPLOY_CONFIG --env <environment>`): the
      # runner masks each line of a secret too, and a config's lines of `{`
      # or `}` alone would mask every brace in the job's logs.
      # CLOUDFLARE_ACCOUNT_ID is named only to be masked: the runner masks
      # every secret a job names, wherever it appears in the job's logs
      # (wrangler's and xtask's registry paths and URLs); unset, it is empty
      # and masks nothing.
      - env:
          DEPLOY_CONFIG: ${{ secrets.DEPLOY_CONFIG }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_TEST_SECRET: ${{ secrets.PREVIEW_TEST_SECRET }}
          CLOUDFLARE_ACCOUNT_ID_MASKED: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          umask 077
          for v in DEPLOY_CONFIG DEPLOY_HOST CLOUDFLARE_API_TOKEN; do
            test -n "${!v}" || { echo "the environment of $GITHUB_REF_NAME's deploy has no $v"; exit 1; }
          done
          if ! printf '%s' "$DEPLOY_CONFIG" | base64 -d > "$RUNNER_TEMP/deploy.jsonc" || ! test -s "$RUNNER_TEMP/deploy.jsonc"; then
            echo "the environment of $GITHUB_REF_NAME's deploy has a DEPLOY_CONFIG that is no config in base64: set it with base64 -w0 < <file> | gh secret set DEPLOY_CONFIG --env <environment>"
            exit 1
          fi
          mkdir -p ~/.config/fragment/secrets
          printf '%s\n' "$CLOUDFLARE_API_TOKEN" > ~/.config/fragment/secrets/cloudflare-api-token
          if [ -n "$PREVIEW_TEST_SECRET" ]; then printf '%s\n' "$PREVIEW_TEST_SECRET" > ~/.config/fragment/secrets/preview-test-secret; fi
      - run: cargo xtask deploy --config "$RUNNER_TEMP/deploy.jsonc" --pinned-only ${{ github.ref_name == 'master' && '--branch preview' || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # the deployment answers with this commit: /healthz's x-fragment-deploy
      # is the deploy's `git rev-parse --short=12 HEAD`. A route can 522 for
      # seconds after a deploy, so it is asked every 10 s, twelve times.
      - env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          want=${GITHUB_SHA::12}
          for _ in $(seq 12); do
            got=$(curl -sI --max-time 10 "https://$DEPLOY_HOST/healthz" | tr -d '\r' | sed -n 's/^x-fragment-deploy: *//Ip')
            case "$got" in "$want"*) echo "https://$DEPLOY_HOST answers with $got"; exit 0 ;; esac
            sleep 10
          done
          echo "https://$DEPLOY_HOST/healthz answers with ${got:-no x-fragment-deploy}, not $want"
          exit 1

