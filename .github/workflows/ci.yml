# fragment-next CI: `cargo xtask check` (host tests and clippy on host and
# wasm, warnings denied). The celld e2e on macOS went with the move to
# Cloudflare (docs/cloudflare-v1.md, Paul 2026-10-03: "we'll return to our
# celld roots once we have cloudflare perfect"); the e2e comes back in
# phase 2, on Linux against workerd and as the hosted lane on a preview.
# The last workflow that ran it is at tag celld-final.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            cell/target
            agent/target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-
      - run: cargo xtask check
