# fragment CI on Linux: `cargo xtask check` (every first-party JavaScript
# file through `node --check` on the pinned Node, host tests and clippy on
# host and wasm, warnings denied), and `cargo xtask e2e`: the cell and the
# agents' Worker under `wrangler dev` (workerd), with fakes only at the
# vendor boundaries (docs/cloudflare-v1.md, phase 2). The celld e2e on
# macOS is at tag celld-final.
#
# The e2e runs in four shards (crates/e2e/src/lanes/mod.rs, SHARDS), each
# on a runner of its own with its own build and node; the `e2e` job checks
# from their summaries that together they ran every section exactly once
# and every check passed (`cargo xtask e2e-summary`). A manual run
# (workflow_dispatch) also runs the suite whole, in one job, to compare.
#
# Caches are restored on every run and saved only from master's pushes
# (a PR reads master's): each key names what it holds below. A save comes
# right after the step that fills it, so a red e2e still saves its build.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # the registry and the debug, test and clippy builds of the three
      # workspaces; a new rustc or lockfile is a new key
      - id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/tools
            cell/target
            agent/target
          key: check-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      # the pinned Node `node --check` runs on, unpacked: the e2e's key,
      # which its first shard saves from master
      - uses: actions/cache/restore@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      - run: cargo xtask check
      # the same paths as the restore (they are part of the cache's version)
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            !target/tools
            cell/target
            agent/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  e2e-shard:
    name: e2e shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # the registry, and what the e2e's build compiles: the CLI and the
      # suite (target/release), xtask (target/debug), and the two Workers'
      # wasm32 builds; a new rustc or lockfile is a new key
      - id: cargo
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/debug
            cell/target
            agent/target
          key: e2e-cargo-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: e2e-cargo-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      # worker-build itself, and the tools it fetches (wasm-bindgen at the
      # lockfiles' version, wasm-opt, esbuild)
      - id: worker-build
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
          key: worker-build-0.8.5-${{ runner.os }}-${{ hashFiles('cell/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: worker-build-0.8.5-${{ runner.os }}-
      # no setup-node: xtask fetches the pinned Node into target/tools
      # (crates/devstack/src/node_release.rs, checked by its SHA-256) and
      # runs its own npm ci; the runner's node is never used. A new pin is
      # a new key.
      - id: node
        uses: actions/cache/restore@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      # what the JavaScript caches (target/cache): npm's tarballs, wrangler's
      # own, and the Chrome for Testing Browser Rendering downloads, which
      # the lockfile's miniflare names
      - id: js
        uses: actions/cache/restore@v4
        with:
          path: target/cache
          key: js-cache-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs', 'package-lock.json') }}
      - run: worker-build --version | grep -q 0.8.5 || cargo install worker-build --version 0.8.5 --locked
      # the Workers, the CLI and the suite, and the computer images the
      # node's boot builds (xtask/src/build.rs), all at once
      - run: cargo xtask e2e --build-only
      - if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cargo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/debug
            cell/target
            agent/target
          key: ${{ steps.cargo.outputs.cache-primary-key }}
      - if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.worker-build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
          key: ${{ steps.worker-build.outputs.cache-primary-key }}
      - if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.node.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/tools
          key: ${{ steps.node.outputs.cache-primary-key }}
      # the aggregate below runs this build's xtask, so it builds nothing
      - if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: e2e-xtask
          path: target/debug/xtask
          retention-days: 1
      # one shard's sections on a fresh node, and their summary; the run's
      # scratch (each node boot's log, the lanes' screenshots) is kept when
      # a check fails, and uploaded below
      - run: cargo xtask e2e --no-build --shard ${{ matrix.shard }}/4 --summary target/e2e-summary/shard-${{ matrix.shard }}.json
        env:
          CHROME_BIN: /usr/bin/google-chrome
      # after the run, from any shard that shot a preview card: miniflare
      # fetches its Chrome for the first one during the run (the first
      # shard to save wins; the others find the key taken)
      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.js.outputs.cache-hit != 'true' && hashFiles('target/cache/.wrangler/chrome/**/.miniflare-install-complete') != ''
        uses: actions/cache/save@v4
        with:
          path: target/cache
          key: ${{ steps.js.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-summary-${{ matrix.shard }}
          path: target/e2e-summary/
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scratch-${{ matrix.shard }}
          path: target/e2e/
          retention-days: 7

  # the check named `e2e`: the shards together ran every section exactly
  # once, their counts add up, and every check passed. It runs whatever the
  # shards did (unless the run was cancelled), so a red shard makes it
  # red, never skipped.
  e2e:
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: e2e-xtask
          path: bin
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-summary-*
          merge-multiple: true
          path: summaries
      - run: chmod +x bin/xtask && bin/xtask e2e-summary summaries
      - if: needs.e2e-shard.result != 'success'
        run: echo "a shard's job failed (${{ needs.e2e-shard.result }}); its log says where" && exit 1

  # a manual run's whole suite in one job, to compare its counts with the
  # shards' (`cargo xtask e2e-summary` prints both the same way)
  e2e-whole:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/release
            target/debug
            cell/target
            agent/target
          key: e2e-cargo-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: e2e-cargo-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
          key: worker-build-0.8.5-${{ runner.os }}-${{ hashFiles('cell/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: worker-build-0.8.5-${{ runner.os }}-
      - uses: actions/cache/restore@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      - uses: actions/cache/restore@v4
        with:
          path: target/cache
          key: js-cache-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs', 'package-lock.json') }}
      - run: worker-build --version | grep -q 0.8.5 || cargo install worker-build --version 0.8.5 --locked
      - run: cargo xtask e2e --summary target/e2e-summary/whole.json
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - if: always()
        run: cargo xtask e2e-summary target/e2e-summary
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scratch-whole
          path: target/e2e/
          retention-days: 7
