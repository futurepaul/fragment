# fragment CI: unit tests for the Rust CLI + the full e2e suite against a
# real celld stack backed by MinIO (S3 — same backend family as production).
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}
      - name: unit tests
        run: cargo test
        working-directory: cli

  e2e:
    runs-on: ubuntu-latest

    env:
      S3_ENDPOINT: http://127.0.0.1:9000
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: miniosecret
      AWS_REGION: us-east-1
      # optional: with this secret set, the guide's ai blocks run in CI too
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      # not a services: container on purpose — this MinIO release ships
      # Cmd=["minio"] with no default `server /data`, and service
      # containers can't be given a command.
      - name: start MinIO (pinned)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minio -e MINIO_ROOT_PASSWORD=miniosecret \
            minio/minio:RELEASE.2025-07-23T15-54-02Z server /data
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live

      - name: install celld
        run: |
          curl -fsSL https://celld.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          command -v celld

      - name: root deps (@noble for signing)
        run: npm install --no-audit --no-fund

      - name: runtime typecheck + build freshness
        run: |
          scripts/build-runtime
          git diff --exit-code --quiet runtime/src || {
            echo "runtime/src is stale — run scripts/build-runtime and commit"; exit 1; }

      - name: create bucket
        run: scripts/ci-bucket

      - name: deploy runtime + start host (with host secret)
        run: |
          export FRAGMENT_HOST_SECRET="$(openssl rand -hex 32)"
          echo "FRAGMENT_HOST_SECRET=$FRAGMENT_HOST_SECRET" >> "$GITHUB_ENV"
          scripts/ci-up

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock') }}

      - name: build CLI
        run: cargo build
        working-directory: cli

      - name: e2e suite
        run: >
          FRAGMENT_BIN="$PWD/cli/target/debug/fragment"
          node scripts/e2e.mjs --all

      - name: celld log on failure
        if: failure()
        run: tail -80 .dev/celld.log
