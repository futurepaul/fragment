# fragment CI: unit tests for the Rust CLI + blobsd, and the full e2e suite
# against celld 0.4.0's `celld dev` (local object store) with the fs-backed
# blobsd tier — all native processes, no docker, no MinIO.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CELLD_VERSION: v0.4.0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
            blobsd/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'blobsd/Cargo.lock') }}
      - name: unit tests
        run: cargo test
        working-directory: cli
      - name: blobsd tests
        run: cargo test --release
        working-directory: blobsd

  e2e:
    runs-on: ubuntu-latest

    env:
      # optional: with this secret set, the guide's ai blocks run in CI too
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable

      - name: install celld (pinned)
        run: |
          mkdir -p ~/.local/bin
          curl -fsSL "https://github.com/denoland/celld/releases/download/${CELLD_VERSION}/celld-x86_64-unknown-linux-gnu.gz" \
            | gunzip > ~/.local/bin/celld
          chmod +x ~/.local/bin/celld
          ~/.local/bin/celld --version

      - name: root deps (@noble for signing)
        run: npm install --no-audit --no-fund

      - name: runtime typecheck + build freshness
        run: |
          scripts/build-runtime
          git diff --exit-code --quiet runtime/src || {
            echo "runtime/src is stale — run scripts/build-runtime and commit"; exit 1; }

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
            blobsd/target
          key: cargo-${{ runner.os }}-${{ hashFiles('cli/Cargo.lock', 'blobsd/Cargo.lock') }}

      - name: build CLI + blobsd
        run: cargo build
        working-directory: cli
      - name: build blobsd (release)
        run: cargo build --release
        working-directory: blobsd

      - name: bring up the native stack (celld dev + fs tier)
        run: |
          export FRAGMENT_HOST_SECRET="$(openssl rand -hex 32)"
          scripts/dev up

      - name: e2e suite
        run: >
          E2E_BLOBSD_TOKEN=e2e-blob-token-0123456789abcdef
          FRAGMENT_BLOB_URL=http://127.0.0.1:9940
          FRAGMENT_BIN="$PWD/cli/target/debug/fragment"
          node scripts/e2e.mjs --all

      - name: host logs on failure
        if: failure()
        run: |
          tail -80 .dev/celld-dev.log 2>/dev/null || true
          tail -40 .dev/blobsd.log 2>/dev/null || true
