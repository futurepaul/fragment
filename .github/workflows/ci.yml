# fragment CI on Linux: `cargo xtask check` (every first-party JavaScript
# file through `node --check` on the pinned Node, host tests and clippy on
# host and wasm, warnings denied), and `cargo xtask e2e`: the cell and the
# agents' Worker under `wrangler dev` (workerd), with fakes only at the
# vendor boundaries (docs/cloudflare-v1.md, phase 2). The celld e2e on
# macOS is at tag celld-final.
name: ci

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            !target/tools
            cell/target
            agent/target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: check-${{ runner.os }}-
      # the pinned Node `node --check` runs on, unpacked (the e2e's cache
      # too): a new pin is a new key
      - uses: actions/cache@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      - run: cargo xtask check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # no setup-node: xtask fetches the pinned Node into target/tools
      # (crates/devstack/src/node_release.rs, checked by its SHA-256) and
      # runs its own npm ci; the runner's node is never used
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/worker-build
            ~/.cache/worker-build
            target
            !target/tools
            !target/cache
            cell/target
            agent/target
          key: e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'cell/Cargo.lock', 'agent/Cargo.lock') }}
          restore-keys: e2e-${{ runner.os }}-
      # the pinned Node, unpacked: a new pin is a new key
      - uses: actions/cache@v4
        with:
          path: target/tools
          key: node-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs') }}
      # what the JavaScript caches (target/cache): npm's tarballs, wrangler's
      # own, and the Chrome for Testing Browser Rendering downloads, which
      # the lockfile's miniflare names
      - uses: actions/cache@v4
        with:
          path: target/cache
          key: js-cache-${{ runner.os }}-${{ hashFiles('crates/devstack/src/node_release.rs', 'package-lock.json') }}
      - run: worker-build --version | grep -q 0.8.5 || cargo install worker-build --version 0.8.5 --locked
      # one run's scratch (each node boot's log, the lanes' screenshots) is
      # kept when a check fails: uploaded below
      - run: cargo xtask e2e
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-scratch
          path: target/e2e/
          retention-days: 7
