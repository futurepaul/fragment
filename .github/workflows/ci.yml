# fragment-next CI: `cargo xtask check` and `cargo xtask e2e`, as run
# locally. The e2e runs on macOS, where it has been proven; it builds the
# celld fork (`cargo xtask celld`) and drives the Chrome the runner has.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: check-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo xtask check

  e2e:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo install worker-build --version 0.8.5 --locked
      - run: cargo xtask celld
      - run: cargo xtask e2e
